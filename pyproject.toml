[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "snipe-price-monitor"
version = "0.1.0"
description = "Cache-first CLI price monitoring"
requires-python = ">=3.10"
dependencies = [
  "beautifulsoup4>=4.12",
  "PyYAML>=6.0",
  "requests>=2.31",
]

[project.scripts]
snipe = "snipe.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]
browser = ["playwright>=1.49"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]
